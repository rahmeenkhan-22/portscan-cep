[General]
network = PortScanNet
sim-time-limit = 60s
cmdenv-express-mode = false

# Victims listen on three "open" ports
**.victim[*].numApps = 3
**.victim[*].app[0].typename = "TcpGenericServerApp"
**.victim[*].app[0].localPort = 80
**.victim[*].app[1].typename = "TcpGenericServerApp"
**.victim[*].app[1].localPort = 443
**.victim[*].app[2].typename = "TcpGenericServerApp"
**.victim[*].app[2].localPort = 22

# Normal client sends web-like requests to victim[0]
**.client.numApps = 1
**.client.app[0].typename = "TcpBasicClientApp"
**.client.app[0].connectAddress = "victim[0]"
**.client.app[0].connectPort = 80
**.client.app[0].startTime = 1s
**.client.app[0].numRequestsPerSession = 5
**.client.app[0].requestLength = 200B
**.client.app[0].replyLength = 1000B
**.client.app[0].thinkTime = 0.5s
**.client.app[0].idleInterval = 2s

# Attacker scans victim[0] with a UDP sweep
**.attacker.numApps = 1
**.attacker.app[0].typename = "PortScanner"
**.attacker.app[0].destAddresses = "victim[0]"
**.attacker.app[0].startTime = 5s
**.attacker.app[0].startPort = 1
**.attacker.app[0].endPort = 100
**.attacker.app[0].scanInterval = 0.05s
**.attacker.app[0].scanMode = "sequential"

# Detector on gateway (Person C)
**.gateway.detector.detectorEnabled = true
**.gateway.detector.threshold = 10
**.gateway.detector.windowSize = 5s

[Config Random]
**.attacker.app[0].scanMode = "random"

[Config Stealth]
**.attacker.app[0].scanMode = "stealth"
**.attacker.app[0].scanInterval = 1s
**.attacker.app[0].endPort = 20

[Config BusyClient]
# S5 / (e): legitimate client hits many ports so the detector can be
# tested for false positives. 8 distinct dest ports inside ~5 s.
**.victim[*].numApps = 8
**.victim[*].app[3].typename = "TcpGenericServerApp"
**.victim[*].app[3].localPort = 8080
**.victim[*].app[4].typename = "TcpGenericServerApp"
**.victim[*].app[4].localPort = 8443
**.victim[*].app[5].typename = "TcpGenericServerApp"
**.victim[*].app[5].localPort = 21
**.victim[*].app[6].typename = "TcpGenericServerApp"
**.victim[*].app[6].localPort = 25
**.victim[*].app[7].typename = "TcpGenericServerApp"
**.victim[*].app[7].localPort = 53

**.client.numApps = 8
**.client.app[*].typename = "TcpBasicClientApp"
**.client.app[*].connectAddress = "victim[0]"
**.client.app[*].numRequestsPerSession = 5
**.client.app[*].requestLength = 200B
**.client.app[*].replyLength = 1000B
**.client.app[*].thinkTime = 0.5s
**.client.app[*].idleInterval = 2s
**.client.app[0].connectPort = 80
**.client.app[0].startTime = 1.0s
**.client.app[1].connectPort = 443
**.client.app[1].startTime = 1.4s
**.client.app[2].connectPort = 22
**.client.app[2].startTime = 1.8s
**.client.app[3].connectPort = 8080
**.client.app[3].startTime = 2.2s
**.client.app[4].connectPort = 8443
**.client.app[4].startTime = 2.6s
**.client.app[5].connectPort = 21
**.client.app[5].startTime = 3.0s
**.client.app[6].connectPort = 25
**.client.app[6].startTime = 3.4s
**.client.app[7].connectPort = 53
**.client.app[7].startTime = 3.8s